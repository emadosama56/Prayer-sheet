plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

android {
    signingConfigs {
        // A fixed key, so the SHA-1 Google Sign-In is registered against stays
        // the same across machines and CI runs. It carries Android's public
        // debug credentials on purpose: it is not a secret, and it is not an
        // upload key for the Play Store.
        release {
            storeFile = file("prayer-sheet.keystore")
            storePassword = "android"
            keyAlias = "prayersheet"
            keyPassword = "android"
        }
    }

    namespace = "com.emadosama.prayer_sheet"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // flutter_local_notifications schedules through java.time, so the
        // library APIs must be desugared for older Android versions.
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.emadosama.prayer_sheet"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // cloud_firestore needs 23. That is Android 6.0, which all but a
        // sliver of devices still in use are past.
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled = true
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
    // Guards against the Android 12L+ crash the notification plugin's readme
    // documents as a side effect of enabling desugaring.
    implementation "androidx.window:window:1.0.0"
    implementation "androidx.window:window-java:1.0.0"
}
