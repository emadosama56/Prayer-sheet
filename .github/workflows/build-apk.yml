name: Build APK

on:
  push:
    branches: [claude/flutter-prayer-tracker-app-lphdde, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Name the APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/prayer-sheet.apk
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: prayer-sheet-apk
          path: dist/prayer-sheet.apk

      # A fixed tag, so the download link below never changes between builds.
      - name: Publish to the rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: أحدث نسخة APK
          body: |
            نزّل `prayer-sheet.apk` وثبّته على الموبايل.

            التطبيق موقّع بمفتاح debug (للتجربة الشخصية)، فأندرويد هيسألك
            تسمح بالتثبيت من مصدر غير معروف — وافق عادي.

            Build: ${{ github.sha }}
          files: dist/prayer-sheet.apk
          fail_on_unmatched_files: true
