name: Build APK

on:
  push:
    branches: [claude/flutter-prayer-tracker-app-lphdde, main]
  workflow_dispatch:

permissions:
  contents: write

# Two runs must never race to publish the same release tag.
concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true

      - run: flutter pub get

      # A malformed layout only surfaces deep in the Gradle build, minutes in.
      # Parsing is instant and needs no Android tooling at all.
      - name: Check the Android XML parses
        run: |
          python3 - <<'EOF'
          import pathlib, sys
          from xml.etree import ElementTree
          bad = []
          for path in sorted(pathlib.Path('android/app/src/main').rglob('*.xml')):
              try:
                  ElementTree.parse(path)
              except ElementTree.ParseError as error:
                  bad.append(f'{path}: {error}')
          for line in bad:
              print(f'::error::{line}')
          sys.exit(1 if bad else 0)
          EOF

      - run: flutter analyze
      - run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Name the APK
        id: apk
        run: |
          # The build number in pubspec.yaml is the release number: 1.1.0+2 -> v2.
          BUILD=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/.*\+([0-9]+).*/\1/')
          echo "version=v$BUILD" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/prayer-sheet-v$BUILD.apk"
          cp build/app/outputs/flutter-apk/app-release.apk dist/prayer-sheet.apk
          ls -lh dist

      # The chime and the status bar icon are named from Dart, never from
      # Java, so the resource shrinker will silently drop them again if the
      # keep rule is lost. Nothing in the Dart tests can catch that.
      - name: Check the runtime-only resources survived shrinking
        run: |
          set -euo pipefail
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          # Match on resource name, not file size: shrinking renames the
          # packaged files and AGP recompresses PNGs, so sizes do not survive.
          "$AAPT2" dump resources dist/prayer-sheet.apk > /tmp/res.txt
          for name in raw/soft_chime drawable/ic_stat_reminder; do
            if ! grep -q "$name" /tmp/res.txt; then
              echo "::error::$name is missing from the APK"
              exit 1
            fi
            echo "ok: $name"
          done
          # The table naming a resource is not the same as the file being in
          # the package, so confirm the chime is really there as audio.
          python3 - <<'EOF'
          import sys, zipfile
          apk = zipfile.ZipFile('dist/prayer-sheet.apk')
          wavs = [i.filename for i in apk.infolist()
                  if i.file_size > 1000 and apk.read(i.filename)[:4] == b'RIFF']
          if not wavs:
              sys.exit('::error::no audio file is packaged in the APK')
          print('ok: audio packaged as', wavs)
          EOF

      # The shrinker dropping Gson's TypeToken is what silently broke every
      # scheduled reminder, and it only showed up on a phone. The plugin's own
      # classes survived either way, so they are not the thing to check: the
      # build that was broken and the build that works differ exactly here.
      - name: Check the shrinker kept what the schedule needs
        run: |
          set -euo pipefail
          DEX=$(unzip -p dist/prayer-sheet.apk 'classes*.dex' | tr -c '[:print:]' '\n')
          for symbol in \
            com/dexterous/flutterlocalnotifications \
            com/google/gson/reflect/TypeToken
          do
            if ! grep -qa "$symbol" <<< "$DEX"; then
              echo "::error::$symbol was stripped; scheduled reminders cannot persist"
              exit 1
            fi
            echo "ok: $symbol"
          done

      # The widget is native: no Dart test can tell whether its layout, its
      # provider or its receiver actually shipped.
      - name: Check the home screen widget shipped
        run: |
          set -euo pipefail
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump resources dist/prayer-sheet.apk > /tmp/wres.txt
          for name in layout/prayer_widget xml/prayer_widget_info drawable/widget_pill_done id/widget_streak; do
            grep -q "$name" /tmp/wres.txt || {
              echo "::error::$name is missing from the APK"; exit 1; }
            echo "ok: $name"
          done
          DEX=$(unzip -p dist/prayer-sheet.apk 'classes*.dex' | tr -c '[:print:]' '\n')
          for symbol in PrayerWidgetProvider es/antonborri/home_widget; do
            grep -qa "$symbol" <<< "$DEX" || {
              echo "::error::$symbol is missing from the APK"; exit 1; }
            echo "ok: $symbol"
          done
          if ! "$AAPT2" dump xmltree --file AndroidManifest.xml dist/prayer-sheet.apk \
               | grep -q 'PrayerWidgetProvider'; then
            echo "::error::the widget is not declared in the manifest"
            exit 1
          fi
          echo "ok: widget declared in the manifest"

      - uses: actions/upload-artifact@v4
        with:
          name: prayer-sheet-apk
          path: dist/prayer-sheet.apk

      # Kept forever, so every build stays downloadable.
      - name: Publish the numbered release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.version }}
          name: ${{ steps.apk.outputs.version }}
          body: |
            نسخة ${{ steps.apk.outputs.version }} من التطبيق.

            التطبيق موقّع بمفتاح debug (للتجربة الشخصية)، فأندرويد هيسألك
            تسمح بالتثبيت من مصدر غير معروف — وافق عادي.

            Build: ${{ github.sha }}
          files: dist/prayer-sheet-*.apk
          fail_on_unmatched_files: true

      # A fixed tag alongside the numbered ones, so the download link a phone
      # has bookmarked always points at the newest build.
      - name: Update the rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: أحدث نسخة APK
          body: |
            أحدث نسخة (${{ steps.apk.outputs.version }}).
            النسخ السابقة كلها محفوظة في صفحة الـ releases.

            Build: ${{ github.sha }}
          files: dist/prayer-sheet.apk
          fail_on_unmatched_files: true
